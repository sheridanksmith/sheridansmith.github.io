<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheridan K. Smith – Journalist, Photo Editor and Researcher</title>
  <meta name="description" content="Portfolio of Sheridan K. Smith: photographed stories, written articles, visual investigations and collaborative reporting.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#work">Skip to the work</a>

  <header class="intro">
    <h1 id="site-name">Sheridan K. Smith</h1>
    <div id="site-bio" class="bio"></div>
    <ul id="site-links" class="links"></ul>
  </header>

  <main>
    <section class="work" id="work" aria-labelledby="work-heading">
      <h2 id="work-heading" class="visually-hidden">Selected work</h2>

      <nav class="filter" aria-label="Filter work by type">
        <p class="filter-lead">Show me</p>
        <div id="filter-buttons" class="filter-buttons"></div>
      </nav>

      <p id="filter-note" class="filter-note" aria-live="polite"></p>
      <ol id="project-list" class="project-list"></ol>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
